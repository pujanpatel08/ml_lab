[project]
name = "ml-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pujan Patel", email = "pujanpatel8@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=2.4.0",
    "ipykernel>=7.4.0",
    "mlx>=0.32.4",
    "mlx-lm>=0.32.2",
    "modal>=1.6.3",
    "torch>=2.15.0",
    "wandb>=0.31.0",
]

[project.scripts]
ml-lab = "ml_lab:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
